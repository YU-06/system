name: Controlled Research Performance Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controlled-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    environment: research-controlled
    runs-on: [self-hosted, linux, x64, brainseg-research-cpu]
    timeout-minutes: 90
    env:
      BRAINSEG_BENCHMARK_URL: ${{ secrets.BRAINSEG_BENCHMARK_URL }}
      BRAINSEG_BENCHMARK_INPUT: ${{ secrets.BRAINSEG_BENCHMARK_INPUT }}
      BRAINSEG_BENCHMARK_MANIFEST: ${{ secrets.BRAINSEG_BENCHMARK_MANIFEST }}
      BRAINSEG_BENCHMARK_API_KEY: ${{ secrets.BRAINSEG_BENCHMARK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - run: uv python install 3.12.10
      - run: uv sync --frozen --extra training --extra reports
      - name: Run real research model benchmark in disposable storage
        run: |
          test -n "$BRAINSEG_BENCHMARK_URL"
          test -n "$BRAINSEG_BENCHMARK_INPUT"
          test -n "$BRAINSEG_BENCHMARK_MANIFEST"
          test -n "$BRAINSEG_BENCHMARK_API_KEY"
          uv run --frozen python infra/scripts/benchmark_inference.py \
            --input "$BRAINSEG_BENCHMARK_INPUT" \
            --manifest "$BRAINSEG_BENCHMARK_MANIFEST" \
            --base-url "$BRAINSEG_BENCHMARK_URL" \
            --output "$RUNNER_TEMP/phase8-performance.json" \
            --allow-persistent-results
          uv run --frozen python -c "import json,sys; assert json.load(open(sys.argv[1], encoding='utf-8'))['status'] == 'Pass', 'Benchmark did not produce Pass'" \
            "$RUNNER_TEMP/phase8-performance.json"
      - name: Retain sanitized benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-performance-report
          path: ${{ runner.temp }}/phase8-performance.json
          if-no-files-found: warn
          retention-days: 30
