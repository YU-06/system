dataset: BraTS 2020
modality: T2-FLAIR
task: 2D axial Whole Tumor binary segmentation
dataset_root: artifacts/smoke/data
execution_mode: smoke
split_manifest: artifacts/smoke/split_manifest.json
cache_index: artifacts/smoke/preprocessed/index.json
output_directory: artifacts/smoke/runs
preprocessing_version: flair-v1
input_size: 256
train_patients: 2
validation_patients: 1
test_patients: 1
split_seed: 42
experiment_seeds: [42, 2024, 3407]
architectures: [UNet, AttentionUNet]
channels: [2, 4, 8, 16, 32]
foreground_labels: [1, 2, 4]
loss: BCEWithLogitsLoss+DiceLoss
optimizer: Adam
learning_rate: 0.0001
batch_size: 2
max_epochs: 2
early_stopping_patience: 15
checkpoint_metric: validation_dice
threshold: 0.5
threshold_source: validation_only
validation_thresholds: [0.4, 0.5, 0.6]
augmentation:
  train: true
  validation: false
  test: false
device: cpu
test_execution: locked_until_protocol_frozen
result_status: NotRun
bce_weight: 0.5
dice_smoothing: 0.000001
train_empty_fraction: 0.5
horizontal_flip_probability: 0.5
vertical_flip_probability: 0.5
rotate_90: true
num_workers: 0
cpu_threads: 2
early_stopping_min_delta: 0.0