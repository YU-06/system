map $http_x_correlation_id $research_correlation_id {
    "~^[A-Za-z0-9_-]{1,64}$" $http_x_correlation_id;
    default $request_id;
}

log_format research_json escape=json '{"service":"web","timestamp":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,"CorrelationId":"$research_correlation_id"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 64m;
    access_log /dev/stdout research_json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $research_correlation_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }

    location /swagger/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header X-Correlation-Id $research_correlation_id;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /backend-health {
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $research_correlation_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}